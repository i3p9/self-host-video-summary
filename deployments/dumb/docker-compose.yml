services:
  dumb:
    container_name: dumb
    image: iampuid0/dumb:latest
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: 128mb
    stdin_open: true
    tty: true
    environment:
      TZ: America/Moncton
      PUID: 1000 # replace with: id -u media
      PGID: 1000 # replace with: id -g media
    volumes:
      - /srv/dumb/config:/config
      - /srv/dumb/log:/log
      - /srv/dumb/data:/data
      # Use :rshared only if you need mount propagation to external containers.
      - /srv/dumb/mnt/debrid:/mnt/debrid
    ports:
      - "127.0.0.1:3005:3005"   # DUMB frontend
      - "127.0.0.1:5055:5055"   # Seerr
      - "127.0.0.1:8096:8096"   # Jellyfin
      - "127.0.0.1:18080:18080" # Embedded UI proxy
    devices:
      - /dev/fuse:/dev/fuse:rwm
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
