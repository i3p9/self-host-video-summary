services:
  app:
    build: .
    ports:
      - "${BIND_HOST:-127.0.0.1}:${HOST_PORT:-6999}:6999"
    volumes:
      - app_data:/app/data
      - whisper_cache:/root/.cache
      - ./secrets:/app/secrets:ro
    depends_on:
      - ollama
    environment:
      SUMMARIZER: ${SUMMARIZER:-ollama}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_THINKING: ${DEEPSEEK_THINKING:-false}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-moonshotai/kimi-k2.6:free}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      YOUTUBE_COOKIE_FILE: ${YOUTUBE_COOKIE_FILE:-}
      FALLBACK_SUMMARIZER: ${FALLBACK_SUMMARIZER:-}
    env_file:
      - .env
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  app_data:
  ollama_data:
  whisper_cache:
